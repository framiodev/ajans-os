name: Build & Auto-Release AjansOS

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Backend tests
        run: npm test
      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend

  release-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sürüm etiketi zaten yayında mı?
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          gh release view "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            echo "skip=true" >> $env:GITHUB_OUTPUT
            echo "::notice::v$v zaten yayında. Kullanıcılara güncelleme gitmesi için package.json sürümünü artırın."
          } else {
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

      - name: Setup Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Install backend dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
        run: npm ci

      - name: Build Windows Installer (.exe + latest.yml)
        if: steps.gate.outputs.skip != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd frontend
          npm run build
          cd ..
          npx electron-builder --win nsis --publish never

      - name: Read Version
        if: steps.gate.outputs.skip != 'true'
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: FramioMedia AjansOS v${{ steps.pkg.outputs.version }}
          draft: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
