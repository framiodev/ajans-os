<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: sans-serif; font-size: 12px; padding: 10px; color: #ddd; }
    label { display: block; margin: 8px 0 2px; color: #aaa; }
    input { width: 100%; box-sizing: border-box; }
    button { margin-top: 10px; width: 100%; }
    #status { margin-top: 10px; padding: 6px; border-radius: 4px; background: #333; }
    #status.ok { background: #1b5e20; color: #fff; }
    #status.err { background: #7f1d1d; color: #fff; }
    #log { margin-top: 8px; color: #999; font-size: 11px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  </style>
</head>
<body>
  <b>AjansOS Köprüsü</b>
  <label for="port">Port (kurulu uygulama: 4190, geliştirme: 4010)</label>
  <input id="port" value="4190" />
  <label for="token">Bağlantı anahtarı (AjansOS → API Bağlantıları)</label>
  <input id="token" type="password" placeholder="Anahtarı yapıştırın" />
  <button id="connect">Bağlan</button>
  <div id="status">Bağlı değil</div>
  <div id="log"></div>
  <script src="index.js"></script>
</body>
</html>
