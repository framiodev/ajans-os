<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { height: 100%; }
    body { font-family: sans-serif; font-size: 12px; margin: 0; padding: 8px; color: #ddd; overflow-y: auto; }
    label { display: block; margin: 4px 0 1px; color: #aaa; font-size: 11px; }
    input { width: 100%; box-sizing: border-box; margin: 0; }
    button { margin: 6px 0 0; width: 100%; }
    #status { margin-top: 6px; padding: 4px 6px; border-radius: 4px; background: #333; }
    #status.ok { background: #1b5e20; color: #fff; }
    #status.err { background: #7f1d1d; color: #fff; }
    #log { margin-top: 6px; color: #999; font-size: 11px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  </style>
</head>
<body>
  <b>AjansOS Köprüsü <span id="ver" style="color:#888;font-weight:normal">v0.2.1</span></b>
  <div id="status">Bağlı değil</div>
  <label for="port">Port (kurulu: 4190, geliştirme: 4010)</label>
  <input id="port" value="4190" />
  <label for="token">Bağlantı anahtarı</label>
  <input id="token" type="password" placeholder="Anahtarı yapıştırın" />
  <button id="connect">Bağlan</button>
  <div id="log"></div>
  <script src="index.js"></script>
</body>
</html>
